services:
  # Backend API Web Service (Free Tier)
  - type: web
    name: eagle-eye-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eagle-eye-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # Frontend Static Site (Free Tier)
  - type: web
    name: eagle-eye-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: eagle-eye-backend
          property: host

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: eagle-eye-db
    databaseName: eagle_eye
    user: eagle_eye_user
    plan: free
